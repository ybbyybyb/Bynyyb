<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codes Admin</title><style>:root{--y:#8b5cf6;--y2:#5b21b6;--bg:#12081f;--c:#1d1231;--b:#372255;--t:#f5f3ff;--m:#b7a9d6;--g:#22c55e;--r:#ff537f}*{box-sizing:border-box;margin:0;padding:0;font:12px Tahoma,Arial,sans-serif}body{background:linear-gradient(180deg,#1a0f2b,#12081f);color:var(--t);padding:10px}.w{max-width:760px;margin:auto;display:grid;gap:8px}.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:10px}.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.i,button{height:40px;border-radius:10px;border:1px solid #3a245b;background:#211434;color:#fff;padding:0 10px;outline:0}.i{flex:1;min-width:120px}button{cursor:pointer;font-weight:700}.p{background:linear-gradient(180deg,var(--y),var(--y2));border-color:#8f69d5}.g{background:linear-gradient(180deg,#22c55e,#15803d)}.msg{padding:8px 10px;border-radius:10px;background:#211434;border:1px solid #3a245b}.ok{color:#86efac}.bad{color:#fda4af}.list{display:grid;gap:6px;max-height:60vh;overflow:auto}.row{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;background:#211434;border:1px solid #3a245b;border-radius:10px;padding:8px}.code{font-weight:900;letter-spacing:1px}.mut{color:var(--m);font-size:11px}.tag{padding:3px 8px;border-radius:999px;font-size:10px;font-weight:700}.on{background:rgba(34,197,94,.14);color:#86efac}.off{background:rgba(255,83,127,.14);color:#fda4af}.top{display:flex;justify-content:space-between;align-items:center}.small{font-size:11px;color:var(--m)}</style></head><body><div class="w"><div class="card top"><div><div style="font-weight:900">إدارة الأكواد</div><div class="small">نسبة ثابتة يومية ≈ 5.946309% | كود واحد لكل مستخدم كل 24 ساعة | حد أدنى 300 USDT</div></div><button class="p" id="back">رجوع</button></div><div class="card"><div class="r"><input class="i" id="manual" placeholder="كود يدوي اختياري"><input class="i" id="prefix" value="VIP" placeholder="بادئة"><input class="i" id="qty" type="number" min="1" value="1" placeholder="عدد"><button class="g" id="make">إنشاء</button></div><div class="msg" id="msg" style="margin-top:8px">جاهز</div></div><div class="card"><div style="font-weight:900;margin-bottom:8px">آخر الأكواد</div><div class="list" id="list"></div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";import{getFirestore,doc,setDoc,collection,query,orderBy,limit,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";const FC={apiKey:"AIzaSyBIOrNuF0NC5R2UizDd4yGBczeI-VIiR44",authDomain:"quantum-gain.firebaseapp.com",projectId:"quantum-gain",storageBucket:"quantum-gain.firebasestorage.app",messagingSenderId:"128304835273",appId:"1:128304835273:web:e0685d79fe569d7d43bb18",measurementId:"G-9EYFM4WGRC"},app=initializeApp(FC),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s),msg=$("#msg"),list=$("#list"),DR=Math.pow(2,1/12)-1;function info(t,c=""){msg.className="msg "+c;msg.textContent=t}function rnd(p="VIP"){return`${p}${Math.random().toString(36).slice(2,6).toUpperCase()}${Date.now().toString(36).slice(-4).toUpperCase()}`}async function saveCode(code,u){code=(code||"").trim().toUpperCase();if(!code)throw Error("الكود فارغ");await setDoc(doc(db,"codes",code),{code,amount:0,percent:DR,percentText:(DR*100).toFixed(6)+"%",cycleDays:12,cooldownHours:24,minBalance:300,active:!0,used:!1,usedBy:"",profit:0,baseBalance:0,createdBy:u.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp()},{merge:!0})}$("#make").onclick=async()=>{let u=auth.currentUser;if(!u)return;let manual=$("#manual").value.trim().toUpperCase(),prefix=($("#prefix").value.trim().toUpperCase()||"VIP"),qty=Math.max(1,+$("#qty").value||1);try{info("جارٍ الإنشاء...");if(manual){await saveCode(manual,u);info("تم إنشاء/تحديث الكود: "+manual,"ok")}else{for(let i=0;i<qty;i++)await saveCode(rnd(prefix),u);info("تم إنشاء "+qty+" كود","ok")}}catch(e){info(e?.message||"فشل الإنشاء","bad")}};$("#back").onclick=()=>location.href="tradee.html";onAuthStateChanged(auth,u=>{if(!u)return location.replace("login.html");onSnapshot(query(collection(db,"codes"),orderBy("createdAt","desc"),limit(100)),s=>{list.innerHTML="";if(s.empty){list.innerHTML='<div class="mut">لا توجد أكواد</div>';return}s.forEach(x=>{let d=x.data(),used=d.used?'مستخدم':'نشط',cls=d.used?'off':'on',who=d.usedBy||'-',p=(+d.profit||0).toFixed(2),b=(+d.baseBalance||0).toFixed(2);list.insertAdjacentHTML("beforeend",`<div class=row><div><div class=code>${d.code||x.id}</div><div class=mut>النسبة ${d.percentText||((DR*100).toFixed(6)+'%')} | الأساس ${b} USDT | الربح ${p} USDT | المستخدم ${who}</div></div><span class="tag ${cls}">${used}</span><button class=p data-id="${d.code||x.id}">إعادة تفعيل</button></div>`)})})});list.onclick=async e=>{let b=e.target.closest("button[data-id]");if(!b)return;try{await setDoc(doc(db,"codes",b.dataset.id),{active:!0,used:!1,usedBy:"",profit:0,baseBalance:0,amount:0,updatedAt:serverTimestamp()},{merge:!0});info("تمت إعادة تفعيل "+b.dataset.id,"ok")}catch(e){info(e?.message||"فشل إعادة التفعيل","bad")}};</script></body></html>
