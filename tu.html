async function setBan(uid,v){try{await setDoc(doc(db,USERS_COLLECTION,uid),{uid,banned:!!+v,updatedAt:serverTimestamp()},{merge:!0});toast(+v?"تم حظر المستخدم":"تم فك الحظر")}catch{toast("فشل تحديث الحظر")}}
function openEdit(uid){const x=USERS.find(v=>v.uid===uid||v.__id===uid);if(!x)return toast("المستخدم غير موجود");CUR=x.uid;$("mu").value=x.uid;$("mpid").value=x.publicId||"";$("mf").value=x.f||"";$("ml").value=x.l||"";$("me").value=x.email||"";$("mbal").value=(+x.balance||0).toFixed(2);$("mco").value=x.country||"";$("mr").value=x.r||"";$("md").value=x.d||"";$("mrole").value=x.role||"member";$("mkyc").value=x.kycStatus||"";$("msec").value=x.securityEnabled?"1":"0";$("mban").value=x.banned?"1":"0";$("um").classList.remove("h")}
async function saveUser(){if(!CUR)return;try{let r=$("mrole").value==="agent";await setDoc(doc(db,USERS_COLLECTION,CUR),{uid:CUR,f:$("mf").value.trim(),l:$("ml").value.trim(),e:$("me").value.trim(),balance:+$("mbal").value||0,country:$("mco").value.trim(),r:$("mr").value.trim(),d:$("md").value.trim(),role:r?"agent":"member",isAgent:r,agent:r,kycStatus:$("mkyc").value,securityEnabled:$("msec").value==="1",banned:$("mban").value==="1",updatedAt:serverTimestamp()},{merge:!0});$("um").classList.add("h");toast("تم حفظ التعديلات")}catch{toast("فشل حفظ التعديلات")}}
function start(){if(ON)return;ON=1;$("live").textContent="مباشر";onSnapshot(query(collection(db,DEPOSIT_COLLECTION),orderBy("createdAt","desc")),s=>{DEPOSITS=s.docs.map(normalizeDeposit);render()},()=>{DEPOSITS=[];render()});onSnapshot(query(collection(db,WITHDRAW_COLLECTION),orderBy("createdAt","desc")),s=>{WITHDRAWS=s.docs.map(normalizeWithdraw);render()},()=>{WITHDRAWS=[];render()});onSnapshot(collection(db,USERS_COLLECTION),s=>{USERS=s.docs.map(normalizeUser);render()},()=>{USERS=[];render()})}
$("enter").onclick=()=>{$("pin").value===PIN?($("login").remove(),start()):$("lmsg").textContent="الكود غير صحيح"};$("pin").addEventListener("keydown",e=>e.key==="Enter"&&$("enter").click());$("q").oninput=render;$("ucl").onclick=()=>$("um").classList.add("h");$("usv").onclick=saveUser;$("im").onclick=()=>$("im").classList.add("h");
document.addEventListener("click",async e=>{const img=e.target.closest("img[data-img]");if(img){$("big").src=img.dataset.img;$("im").classList.remove("h");return}const b=e.target.closest("button");if(!b)return;if(b.parentElement?.id==="tabs"){TAB=b.dataset.tab;[...$("tabs").querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b));render();return}if(b.dataset.copy!==void 0)try{await navigator.clipboard.writeText(b.dataset.copy);toast("تم النسخ")}catch{toast("تعذر النسخ")}if(b.dataset.doc)st(b.dataset.col,b.dataset.doc,b.dataset.uid,b.dataset.type,b.dataset.s,b.dataset.t);if(b.dataset.ukyc)setKyc(b.dataset.uid,b.dataset.ukyc);if(b.dataset.role)setRole(b.dataset.uid,b.dataset.role);if(b.dataset.ban!==void 0)setBan(b.dataset.uid,b.dataset.ban);if(b.dataset.openedit)openEdit(b.dataset.openedit)});
