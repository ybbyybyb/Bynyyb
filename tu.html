function normalizeDeposit(d){const x=d.data()||{};return{__id:d.id,type:"deposit",collection:DEPOSIT_COLLECTION,requestId:x.requestId||d.id,uid:x.uid||"",email:x.email||"",amount:+x.amount||0,amountText:x.amountText||("$"+(+x.amount||0).toFixed(2)),currency:x.currency||"USDT",network:x.network||"TRC20",method:x.method||"Tether (USDT/TRC20)",address:x.depositAddress||"",bonusEnabled:!!x.bonusEnabled,site:x.site||"",status:x.status||"pending",statusText:x.statusText||(x.status==="approved"?"مقبول":x.status==="rejected"?"مرفوض":"قيد المعالجة"),createdAt:x.createdAt||null,createdAtText:x.createdAtText||"-"}}

><div class="t">الموقع</div><div class="v">${esc(x.site||"-")}</div></div>`}</div><div class="t">${x.type==="withdraw"?"عنوان السحب":"عنوان الإيداع"}</div><div class="ad">${esc(x.address||"-")}</div><div class="ac"><button class="b cp" data-copy="${esc(x.address||"")}">نسخ العنوان</button><button class="b pe" data-col="${esc(x.collection)}" data-doc="${esc(x.__id)}" data-uid="${esc(x.uid)}" data-type="${esc(x.type)}" data-s="pending" data-t="قيد المعالجة">قيد المعالجة</button><button class="b ok" data-col="${esc(x.collection)}" data-doc="${esc(x.__id)}" data-uid="${esc(x.uid)}" data-type="${esc(x.type)}" data-s="approved" data-t="مقبول">قبول</button><button class="b no" data-col="${esc(x.collection)}" data-doc="${esc(x.__id)}" data-uid="${esc(x.uid)}" data-type="${esc(x.type)}" data-s="rejected" data-t="مرفوض">رفض</button></div></div>`}).join(""):`<div class="e c">لا توجد طلبات</div>`}
async function st(col,id,uid,type,s,t){try{const rr=doc(db,col,id),ur=doc(db,"users",uid),sr=doc(db,"users",uid,type==="withdraw"?"withdraw_requests":"deposit_requests",id);await runTransaction(db,async tx=>{const r=await tx.get(rr);if(!r.exists())throw 0;const d=r.data()||{},p=d.status||"pending",a=+d.amount||0;let m=0;if(type==="deposit"){if(p!=="approved"&&s==="approved")m=a;else if(p==="approved"&&s!=="approved")m=-a}else{if(p!=="approved"&&s==="approved")m=-a;else if(p==="approved"&&s!=="approved")m=a}tx.update(rr,{status:s,statusText:t,updatedAt:serverTimestamp()});uid&&tx.set(sr,{status:s,statusText:t,updatedAt:serverTimestamp()},{merge:!0});if(uid&&m){const u=await tx.get(ur),b=u.exists()?(+u.data().balance||0):0;tx.set(ur,{uid,balance:b+m,updatedAt:serverTimestamp()},{merge:!0})}});toast("تم تحديث الحالة")}catch(e){toast("فشل تحديث الحالة")}}
