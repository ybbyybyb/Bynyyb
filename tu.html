<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>لوحة التحكم</title><meta name="theme-color" content="#12081f"><style>:root{--a:#12081f;--b:#1a0f2b;--c:#24153b;--d:#372255;--t:#f5f3ff;--m:#c4b5fd;--x:#8b5cf6;--y:#5b21b6;--g:#22c55e;--r:#ef4444;--o:#f59e0b}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(180deg,var(--b),var(--a));color:var(--t);font:12px/1.6 Tahoma,Arial}button,input,textarea{font:inherit;outline:0;border:0}img{display:block;max-width:100%}.h{display:none!important}.ov{position:fixed;inset:0;background:rgba(10,5,20,.82);display:grid;place-items:center;z-index:99;padding:16px}.lg{width:min(360px,100%);background:rgba(29,18,49,.96);border:1px solid #4d3274;border-radius:22px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.35)}.lg h2{margin:0 0 12px;font-size:18px;text-align:center}.in,.ta{width:100%;background:#1d1231;color:#fff;border:1px solid #4d3274;border-radius:14px;padding:12px}.ta{min-height:88px;resize:vertical}.bt{height:44px;border-radius:14px;background:linear-gradient(180deg,var(--x),var(--y));color:#fff;font-weight:900;cursor:pointer}.bt2{height:40px;border-radius:12px;background:#2b1a45;color:#fff;border:1px solid #4d3274;cursor:pointer}.app{padding:12px 10px 90px}.top{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px}.ttl{font-size:18px;font-weight:900}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tb{padding:10px 12px;border-radius:12px;background:#231438;border:1px solid #3f275f;color:#d8cef5;cursor:pointer}.tb.on{background:linear-gradient(180deg,#8b5cf6,#5b21b6);color:#fff;border-color:#8f69d5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sm{background:rgba(29,18,49,.72);border:1px solid rgba(180,143,255,.28);border-radius:16px;padding:12px}.sm b{display:block;font-size:19px}.sm span{color:#d8cef5;font-size:11px}.bar{display:flex;gap:8px;margin:10px 0}.bar input{flex:1;height:42px;background:#1d1231;color:#fff;border:1px solid #4d3274;border-radius:14px;padding:0 12px}.sec{display:grid;gap:10px}.card{background:rgba(29,18,49,.62);border:1px solid rgba(180,143,255,.28);border-radius:18px;padding:12px;box-shadow:0 8px 18px rgba(0,0,0,.18)}.rw{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.meta,.mini{color:#d8cef5;font-size:11px}.addr{direction:ltr;text-align:left;background:#211434;border:1px solid #3a245b;padding:9px;border-radius:12px;word-break:break-all;margin-top:8px}.act{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ok,.no,.sv{height:38px;padding:0 14px;border-radius:12px;color:#fff;font-weight:900;cursor:pointer}.ok{background:linear-gradient(180deg,#22c55e,#15803d)}.no{background:linear-gradient(180deg,#ef4444,#991b1b)}.sv{background:linear-gradient(180deg,#8b5cf6,#5b21b6)}.bad{padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900}.pending{background:#3b3007;color:#fde047;border:1px solid #8a6d00}.approved{background:#0e2f18;color:#4ade80;border:1px solid #166534}.rejected{background:#2a1020;color:#ffb4b4;border:1px solid #5e2338}.ph{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.ph img{width:100%;height:180px;object-fit:cover;border-radius:14px;background:#fff}.empty{text-align:center;color:#cbbcf0;padding:18px;border:1px dashed #4d3274;border-radius:16px}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#231438;border:1px solid #4d3274;color:#fff;padding:10px 14px;border-radius:12px;opacity:0;visibility:hidden;transition:.2s;z-index:120}.toast.s{opacity:1;visibility:visible}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:640px){.grid,.ph{grid-template-columns:1fr}}</style></head><body>
<div class="ov" id="ov"><div class="lg"><h2>دخول لوحة التحكم</h2><input class="in" id="pin" type="password" placeholder="أدخل الكود السري"><div style="height:10px"></div><button class="bt" id="login">دخول</button><div id="lmsg" class="mini" style="margin-top:10px;text-align:center"></div></div></div>
<div class="app">
<div class="top"><div class="ttl">لوحة التحكم</div><div class="tabs"><button class="tb on" data-t="dep">الإيداع</button><button class="tb" data-t="wd">السحب</button><button class="tb" data-t="kyc">التوثيق</button><button class="tb" data-t="set">الإعدادات</button><button class="tb" id="lock">قفل</button></div></div>
<div class="grid">
<div class="sm"><b id="nDep">0</b><span>طلبات إيداع معلقة</span></div>
<div class="sm"><b id="nWd">0</b><span>طلبات سحب معلقة</span></div>
<div class="sm"><b id="nKyc">0</b><span>طلبات توثيق معلقة</span></div>
<div class="sm"><b id="nUsers">0</b><span>إجمالي المستخدمين</span></div>
</div>
<div class="bar"><input id="q" placeholder="بحث بالبريد أو UID أو العنوان أو الشبكة"><button class="bt2" id="reload">تحديث العرض</button></div>

<div class="sec" id="dep"></div>
<div class="sec h" id="wd"></div>
<div class="sec h" id="kyc"></div>
<div class="sec h" id="set">
<div class="card">
<div class="rw"><b>عنوان الإيداع الحالي</b><span class="mini">المسار: config / deposit</span></div>
<div style="height:8px"></div>
<textarea class="ta" id="depAddr" placeholder="عنوان USDT/TRC20"></textarea>
<div class="act"><button class="sv" id="saveAddr">حفظ عنوان الإيداع</button></div>
</div>
<div class="card mini">قبول الإيداع يزيد رصيد المستخدم مباشرة، وقبول السحب يخصم الرصيد مباشرة، وقبول التوثيق يغيّر <b>kycStatus</b> إلى <b>approved</b>، والرفض يغيّره إلى <b>rejected</b>.</div>
</div>
</div>
<div class="toast" id="t"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import{getFirestore,collection,collectionGroup,doc,setDoc,getDoc,onSnapshot,updateDoc,runTransaction,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const cfg={apiKey:"AIzaSyBIOrNuF0NC5R2UizDd4yGBczeI-VIiR44",authDomain:"quantum-gain.firebaseapp.com",projectId:"quantum-gain",storageBucket:"quantum-gain.firebasestorage.app",messagingSenderId:"128304835273",appId:"1:128304835273:web:e0685d79fe569d7d43bb18",measurementId:"G-9EYFM4WGRC"};
const app=initializeApp(cfg),db=getFirestore(app),$=e=>document.getElementById(e),Q=(e,p=document)=>[...p.querySelectorAll(e)],PIN="123456";
let D=[],W=[],U=[],K=[],RD=[],RW=[],RK=[],tab="dep",off=[];

const E=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const M=n=>"$"+(+n||0).toFixed(2);
const Tm=v=>v?.toMillis?v.toMillis():v?.seconds?v.seconds*1e3:0;
const Dt=(v,t)=>t||((x=Tm(v))?new Date(x).toLocaleString("ar-EG"):"-"); let x=0;
const B=s=>`<span class="bad ${s||"pending"}">${s=="approved"?"مقبول":s=="rejected"?"مرفوض":"قيد الانتظار"}</span>`;
const toast=m=>{t.textContent=m;t.classList.add("s");clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove("s"),1700)};
const hit=(...a)=>!(q.value||"").trim()||a.join(" ").toLowerCase().includes(q.value.trim().toLowerCase());
const sort=a=>a.sort((x,y)=>Tm(y.createdAt||y.kycSubmittedAt||y.updatedAt)-Tm(x.createdAt||x.kycSubmittedAt||x.updatedAt));
const stat=()=>{nDep.textContent=D.filter(x=>(x.status||"pending")=="pending").length;nWd.textContent=W.filter(x=>(x.status||"pending")=="pending").length;nKyc.textContent=K.filter(x=>(x.kycStatus||"")=="pending").length;nUsers.textContent=U.length};
const sw=s=>{tab=s;Q(".tb").forEach(b=>b.classList.toggle("on",b.dataset.t==s));["dep","wd","kyc","set"].forEach(id=>$(id).classList.toggle("h",id!=s))};

function depHtml(){
RD=sort(D.filter(x=>hit(x.email,x.uid,x.depositAddress,x.network,x.method,x.amount))).map(x=>x);
dep.innerHTML=RD.length?RD.map((x,i)=>`<div class="card"><div class="rw"><b>${M(x.amount)} - ${E(x.method||"إيداع")}</b>${B(x.status||"pending")}</div><div class="meta">${E(x.email||"-")} • ${E(x.uid||"-")}</div><div class="meta">${E(x.network||"-")} • ${Dt(x.createdAt,x.createdAtText)}</div><div class="addr">${E(x.depositAddress||"-")}</div>${x.bonusEnabled?`<div class="mini">المكافأة: مفعلة</div>`:""}${x.adminReason?`<div class="mini">السبب: ${E(x.adminReason)}</div>`:""}<div class="act">${(x.status||"pending")=="pending"?`<button class="ok" data-i="${i}" data-a="ok">قبول</button><button class="no" data-i="${i}" data-a="no">رفض</button>`:""}</div></div>`).join(""):`<div class="empty">لا توجد طلبات إيداع مطابقة</div>`
}
function wdHtml(){
RW=sort(W.filter(x=>hit(x.email,x.uid,x.address,x.network,x.amount))).map(x=>x);
wd.innerHTML=RW.length?RW.map((x,i)=>`<div class="card"><div class="rw"><b>${M(x.amount)} - ${E(x.network||"سحب")}</b>${B(x.status||"pending")}</div><div class="meta">${E(x.email||"-")} • ${E(x.uid||"-")}</div><div class="meta">الرصيد قبل السحب: ${M(x.balanceBefore)} • ${Dt(x.createdAt)}</div><div class="addr">${E(x.address||"-")}</div>${x.adminReason?`<div class="mini">السبب: ${E(x.adminReason)}</div>`:""}<div class="act">${(x.status||"pending")=="pending"?`<button class="ok" data-i="${i}" data-a="ok">قبول</button><button class="no" data-i="${i}" data-a="no">رفض</button>`:""}</div></div>`).join(""):`<div class="empty">لا توجد طلبات سحب مطابقة</div>`
}
function kycHtml(){
K=U.filter(x=>x.kycStatus||x.idFront||x.idBack);
RK=sort(K.filter(x=>hit(x.e,x.email,x.uid,x.publicId,x.f,x.l,x.country,x.r,x.kycStatus))).map(x=>x);
kyc.innerHTML=RK.length?RK.map((x,i)=>`<div class="card"><div class="rw"><b>${E((x.f||"")+" "+(x.l||""))||"بدون اسم"}</b>${B(x.kycStatus||"pending")}</div><div class="meta">${E(x.e||x.email||"-")} • UID: ${E(x.uid||x.id||"-")}</div><div class="meta">ID عام: ${E(x.publicId||"-")} • ${E(x.country||"-")} • ${E(x.r||"-")}</div><div class="meta">تاريخ الميلاد: ${E(x.d||"-")} • تاريخ الطلب: ${Dt(x.kycSubmittedAt)}</div>${x.idFront||x.idBack?`<div class="ph">${x.idFront?`<img loading="lazy" src="${x.idFront}" alt="">`:`<div class="empty">لا توجد صورة أمامية</div>`}${x.idBack?`<img loading="lazy" src="${x.idBack}" alt="">`:`<div class="empty">لا توجد صورة خلفية</div>`}</div>`:""}${x.kycRejectReason?`<div class="mini">سبب الرفض: ${E(x.kycRejectReason)}</div>`:""}<div class="act">${(x.kycStatus||"pending")=="pending"?`<button class="ok" data-i="${i}" data-a="ok">قبول</button><button class="no" data-i="${i}" data-a="no">رفض</button>`:""}</div></div>`).join(""):`<div class="empty">لا توجد طلبات توثيق مطابقة</div>`
}
const render=()=>{depHtml();wdHtml();kycHtml();stat()}

async function depAct(x,ok){
if(!x)return; let rs=ok?"":prompt("سبب الرفض","")||"";
try{
await runTransaction(db,async tr=>{
let s=await tr.get(x.ref),d=s.data(); if(!d||(d.status||"pending")!="pending")throw 0;
if(ok){
let ur=doc(db,"users",d.uid),us=await tr.get(ur),bal=+((us.data()||{}).balance||0),am=+(d.amount||0);
tr.set(ur,{balance:bal+am,updatedAt:serverTimestamp()},{merge:true});
tr.update(x.ref,{status:"approved",credited:true,processedAt:serverTimestamp(),adminReason:"",adminBy:"panel"});
}else tr.update(x.ref,{status:"rejected",processedAt:serverTimestamp(),adminReason:rs,adminBy:"panel"});
});
toast(ok?"تم قبول الإيداع":"تم رفض الإيداع");
}catch{toast("تعذر تنفيذ العملية")}
}
async function wdAct(x,ok){
if(!x)return; let rs=ok?"":prompt("سبب الرفض","")||"";
try{
await runTransaction(db,async tr=>{
let s=await tr.get(x.ref),d=s.data(); if(!d||(d.status||"pending")!="pending")throw 0;
if(ok){
let ur=doc(db,"users",d.uid),us=await tr.get(ur),bal=+((us.data()||{}).balance||0),am=+(d.amount||0);
if(bal<am)throw 0;
tr.set(ur,{balance:bal-am,updatedAt:serverTimestamp()},{merge:true});
tr.update(x.ref,{status:"approved",debited:true,processedAt:serverTimestamp(),adminReason:"",adminBy:"panel"});
}else tr.update(x.ref,{status:"rejected",processedAt:serverTimestamp(),adminReason:rs,adminBy:"panel"});
});
toast(ok?"تم قبول السحب":"تم رفض السحب");
}catch{toast("فشل العملية أو الرصيد غير كافٍ")}
}
async function kycAct(x,ok){
if(!x)return; let rs=ok?"":prompt("سبب رفض التوثيق","")||"";
try{await updateDoc(x.ref,{kycStatus:ok?"approved":"rejected",kycReviewedAt:serverTimestamp(),kycRejectReason:ok?"":rs,updatedAt:serverTimestamp()});toast(ok?"تم قبول التوثيق":"تم رفض التوثيق")}catch{toast("تعذر تحديث التوثيق")}}
async function loadAddr(){try{let s=await getDoc(doc(db,"config","deposit"));depAddr.value=s.exists()?s.data().address||"":""}catch{}}
function start(){
off.push(onSnapshot(collectionGroup(db,"deposit_requests"),s=>{D=s.docs.map(d=>({id:d.id,ref:d.ref,...d.data()}));render()}));
off.push(onSnapshot(collection(db,"withdraw_requests"),s=>{W=s.docs.map(d=>({id:d.id,ref:d.ref,...d.data()}));render()}));
off.push(onSnapshot(collection(db,"users"),s=>{U=s.docs.map(d=>({id:d.id,ref:d.ref,...d.data()}));render()}));
off.push(onSnapshot(doc(db,"config","deposit"),s=>{depAddr.value=s.exists()?s.data().address||"":""}));
}

login.onclick=()=>{if(pin.value===PIN){sessionStorage.adminOk=1;ov.classList.add("h");start();loadAddr()}else lmsg.textContent="الكود غير صحيح"};
pin.addEventListener("keydown",e=>e.key=="Enter"&&login.click());
if(sessionStorage.adminOk==1){ov.classList.add("h");start();loadAddr()}
Q(".tb").forEach(b=>b.onclick=()=>b.dataset.t&&sw(b.dataset.t));
lock.onclick=()=>{sessionStorage.removeItem("adminOk");location.reload()};
q.oninput=render;reload.onclick=render;

dep.onclick=e=>{let b=e.target.closest("[data-a]");if(!b)return;depAct(RD[+b.dataset.i],b.dataset.a=="ok")};
wd.onclick=e=>{let b=e.target.closest("[data-a]");if(!b)return;wdAct(RW[+b.dataset.i],b.dataset.a=="ok")};
kyc.onclick=e=>{let b=e.target.closest("[data-a]");if(!b)return;kycAct(RK[+b.dataset.i],b.dataset.a=="ok")};
saveAddr.onclick=async()=>{let v=depAddr.value.trim();if(!v)return toast("أدخل عنوان الإيداع");try{await setDoc(doc(db,"config","deposit"),{address:v,updatedAt:serverTimestamp()},{merge:true});toast("تم حفظ عنوان الإيداع")}catch{toast("فشل الحفظ")}};
</script></body></html>
