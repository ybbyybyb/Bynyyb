<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم الإيداعات</title><style>*{box-sizing:border-box;font-family:Tahoma,Arial}body{margin:0;background:#12081f;color:#fff}a{text-decoration:none;color:inherit}.w{max-width:1200px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.ttl{font-size:22px;font-weight:900}.x,.i,.b{background:#231438;border:1px solid #4d3274;color:#fff;border-radius:14px}.x{padding:10px 14px}.s{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.k{padding:14px}.k b{display:block;font-size:22px;margin-bottom:4px}.i{width:100%;padding:12px;margin-bottom:12px}.r{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.c{background:rgba(29,18,49,.8);border:1px solid rgba(180,143,255,.28);border-radius:18px;padding:14px;box-shadow:0 10px 24px rgba(0,0,0,.22)}.h{display:flex;justify-content:space-between;gap:10px;align-items:start}.amt{font-size:22px;font-weight:900;color:#c4b5fd}.st{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}.p{background:#3b2a12;color:#ffd36b}.a{background:#123621;color:#86efac}.rj{background:#3e1616;color:#fca5a5}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.t{font-size:11px;color:#cbbcf0}.v{font-size:13px;font-weight:800;word-break:break-word}.ad{direction:ltr;text-align:left;background:rgba(255,255,255,.05);padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.08);word-break:break-all}.ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.b{padding:10px 12px;cursor:pointer}.b.ok{background:#163a26;border-color:#245f3a}.b.no{background:#4a1717;border-color:#7a2b2b}.b.pe{background:#3b2a12;border-color:#6f5120}.b.cp{background:#2b1a45}.e{padding:28px;text-align:center;color:#cbbcf0}.m{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;padding:14px;z-index:9}.mb{width:100%;max-width:360px;background:#1a0f2b;border:1px solid #4d3274;border-radius:18px;padding:18px}.mb h3{margin:0 0 12px}.mb input{width:100%;height:46px;border:1px solid #4d3274;background:#231438;color:#fff;border-radius:12px;padding:0 12px;direction:ltr;text-align:left}.br{display:flex;gap:8px;margin-top:10px}.br button{flex:1;height:42px;border:0;border-radius:12px;color:#fff;font-weight:800;cursor:pointer}.ok2{background:linear-gradient(180deg,#8b5cf6,#5b21b6)}.msg{font-size:12px;color:#ffb4b4;margin-top:8px}.to{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#231438;border:1px solid #4d3274;padding:10px 14px;border-radius:12px;opacity:0;visibility:hidden;transition:.2s}.to.s{opacity:1;visibility:visible}@media(max-width:800px){.s{grid-template-columns:1fr 1fr}}@media(max-width:520px){.s,.g{grid-template-columns:1fr}}</style></head><body>
<div class="m" id="login"><div class="mb"><h3>دخول لوحة التحكم</h3><input id="pin" type="password" placeholder="123456"><div class="br"><button class="ok2" id="enter">دخول</button><button onclick="location.reload()">إلغاء</button></div><div class="msg" id="lmsg"></div></div></div>

<div class="w">
<div class="top"><div class="ttl">لوحة تحكم الإيداعات</div><div class="x" id="live">غير متصل</div></div>
<div class="s">
<div class="c k"><b id="nAll">0</b><span>كل الطلبات</span></div>
<div class="c k"><b id="nPen">0</b><span>قيد المعالجة</span></div>
<div class="c k"><b id="nApp">0</b><span>مقبول</span></div>
<div class="c k"><b id="nRej">0</b><span>مرفوض</span></div>
</div>
<input class="i" id="q" placeholder="بحث بالإيميل أو رقم الطلب أو العنوان أو الحالة">
<div class="r" id="rows"><div class="e c">أدخل الكود أولًا</div></div>
</div>

<div class="to" id="to">تم النسخ</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";
import{getFirestore,collection,query,orderBy,onSnapshot,doc,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
const $=x=>document.getElementById(x),cfg={apiKey:"AIzaSyBIOrNuF0NC5R2UizDd4yGBczeI-VIiR44",authDomain:"quantum-gain.firebaseapp.com",projectId:"quantum-gain",storageBucket:"quantum-gain.firebasestorage.app",messagingSenderId:"128304835273",appId:"1:128304835273:web:e0685d79fe569d7d43bb18",measurementId:"G-9EYFM4WGRC"},app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),PIN="123456";let A=[],ON=0;
signInAnonymously(auth).catch(()=>0);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m])),badge=s=>s=="approved"?["مقبول","a"]:s=="rejected"?["مرفوض","rj"]:["قيد المعالجة","p"],toast=t=>{$("to").textContent=t;$("to").classList.add("s");setTimeout(()=>$("to").classList.remove("s"),1200)};
function counts(a){$("nAll").textContent=a.length;$("nPen").textContent=a.filter(x=>x.status=="pending").length;$("nApp").textContent=a.filter(x=>x.status=="approved").length;$("nRej").textContent=a.filter(x=>x.status=="rejected").length}
function render(){let q=$("q").value.trim().toLowerCase(),a=A.filter(x=>!q||[x.requestId,x.email,x.depositAddress,x.statusText,x.status].join(" ").toLowerCase().includes(q));counts(A);$("rows").innerHTML=a.length?a.map(x=>{let b=badge(x.status);return `<div class=c><div class=h><div><div class=amt>${esc(x.amountText||("$"+(+x.amount||0).toFixed(2)))}</div><div class=t>${esc(x.method||"Tether (USDT/TRC20)")}</div></div><div class="st ${b[1]}">${b[0]}</div></div><div class=g><div><div class=t>رقم الطلب</div><div class=v>${esc(x.requestId||"-")}</div></div><div><div class=t>التاريخ</div><div class=v>${esc(x.createdAtText||"-")}</div></div><div><div class=t>الإيميل</div><div class=v>${esc(x.email||"-")}</div></div><div><div class=t>المستخدم</div><div class=v>${esc(x.uid||"-")}</div></div><div><div class=t>العملة</div><div class=v>${esc(x.currency||"USDT")}</div></div><div><div class=t>الشبكة</div><div class=v>${esc(x.network||"TRC20")}</div></div><div><div class=t>المكافأة</div><div class=v>${x.bonusEnabled?"مفعلة":"غير مفعلة"}</div></div><div><div class=t>الحالة النصية</div><div class=v>${esc(x.statusText||"-")}</div></div></div><div class=t>عنوان الإيداع</div><div class=ad>${esc(x.depositAddress||"-")}</div><div class=ac><button class="b cp" data-copy="${esc(x.depositAddress||"")}">نسخ العنوان</button><button class="b pe" data-id="${esc(x.requestId)}" data-uid="${esc(x.uid)}" data-s="pending" data-t="قيد المعالجة">قيد المعالجة</button><button class="b ok" data-id="${esc(x.requestId)}" data-uid="${esc(x.uid)}" data-s="approved" data-t="مقبول">قبول</button><button class="b no" data-id="${esc(x.requestId)}" data-uid="${esc(x.uid)}" data-s="rejected" data-t="مرفوض">رفض</button></div></div>`}).join(""):`<div class="e c">لا توجد طلبات</div>`}
async function st(id,uid,s,t){try{await updateDoc(doc(db,"deposit_requests",id),{status:s,statusText:t,updatedAt:serverTimestamp()});await updateDoc(doc(db,"users",uid,"deposit_requests",id),{status:s,statusText:t,updatedAt:serverTimestamp()}).catch(()=>0);toast("تم تحديث الحالة")}catch(e){toast("فشل تحديث الحالة")}}
function start(){if(ON)return;ON=1;$("live").textContent="مباشر";onSnapshot(query(collection(db,"deposit_requests"),orderBy("createdAt","desc")),s=>{A=s.docs.map(d=>d.data());render()})}
$("enter").onclick=()=>{$("pin").value===PIN?($("login").remove(),start()):$("lmsg").textContent="الكود غير صحيح"};
$("pin").addEventListener("keydown",e=>e.key=="Enter"&&$("enter").click());
$("q").oninput=render;
document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b)return;if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast("تم النسخ")}catch{toast("تعذر النسخ")}}if(b.dataset.id)st(b.dataset.id,b.dataset.uid,b.dataset.s,b.dataset.t)});
</script></body></html>
